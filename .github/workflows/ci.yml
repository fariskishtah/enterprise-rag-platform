name: EnterpriseRAG CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev,media]'
      - name: Run Ruff Linter
        run: ruff check backend/app/ backend/tests/
      - name: Run Pytest Suite
        run: pytest backend/tests/ -v -k "not real_models and not real_transcription"

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Typecheck and Build
        run: |
          cd frontend
          npx tsc --noEmit
          npm run build
